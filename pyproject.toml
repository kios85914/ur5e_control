[project]
name = "ur5e-control"
version = "0.1.0"
description = "Pure control library for the UR5e over URScript socket transport"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
test = ["pytest"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.setuptools]
packages = ["ur5e_control", "ur5e_control.force"]
