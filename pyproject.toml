[project]
name = "ur5e-control"
version = "0.1.0"
description = "Pure control library for the UR5e over URScript socket transport"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
test = ["pytest"]
sim = ["mujoco"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.setuptools]
packages = ["ur5e_control", "ur5e_control.force", "ur5e_control.gui", "ur5e_control.sim"]

[tool.setuptools.package-data]
"ur5e_control.gui" = ["index.html"]
"ur5e_control.urscript" = ["*.script"]
"ur5e_control.sim" = ["assets/ur5e/*.xml", "assets/ur5e/assets/*.obj", "assets/ur5e/*"]
